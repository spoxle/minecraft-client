name: Release

on:
    push:
        tags:
            - "v*"

permissions:
    contents: write

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      artifact: mc-manager-linux-x86_64
                      binary: mc-manager

                    - os: windows-latest
                      artifact: mc-manager-windows-x86_64.exe
                      binary: mc-manager.exe

                    - os: macos-13
                      artifact: mc-manager-macos-x86_64
                      binary: mc-manager

                    - os: macos-latest
                      artifact: mc-manager-macos-aarch64
                      binary: mc-manager

        runs-on: ${{ matrix.os }}

        steps:
            - uses: actions/checkout@v4

            - name: Build
              run: cargo build --release

            - name: Rename binary
              shell: bash
              run: cp "target/release/${{ matrix.binary }}" "${{ matrix.artifact }}"

            - name: Upload build
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.artifact }}
                  path: ${{ matrix.artifact }}

    release:
        needs: build
        runs-on: ubuntu-latest

        steps:
            - uses: actions/download-artifact@v5
              with:
                  path: artifacts
                  merge-multiple: true

            - name: Create GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release create "${{ github.ref_name }}" artifacts/* --generate-notes
